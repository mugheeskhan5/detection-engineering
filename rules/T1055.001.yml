title: Loading DLL Manually Through Mavinject
id: 9fc14cf8-d239-4139-baca-f2db96e7d572
status: test
description: Detects execution of mavinject.exe, which can be used to manually inject a DLL into another process.

tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - attack.t1055.001

logsource:
  category: process_creation
  product: windows

detection:
  selection:
    Image|endswith: '\mavinject.exe'

  condition: selection

level: high

falsepositives:
  - Legitimate Microsoft App-V virtualization infrastructure (confirm with system owners before escalating).