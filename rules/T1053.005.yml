title: Task Creation with SYSTEM Privileges
id: 1a964fc9-b02d-4bd9-8a93-0af97d234b2e
status: test
description: Detects creation of a scheduled task configured to run as the SYSTEM account.

tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1053.005

logsource:
  category: process_creation
  product: windows

detection:
  selection:
    CommandLine|contains|all:
      - 'schtasks.exe'
      - '/create'
      - '/ru system'
      - '/tr'
      - 'cmd.exe'

  condition: selection

level: high

falsepositives:
  - Legitimate administrative task creation.
  - Software installation or enterprise management tools creating scheduled tasks.