title: Listing Running Programs
id: 671faf4f-64f8-4cc9-99ba-bdd84bf1e092
status: test
description: Detects execution of tasklist.exe, which can be used to enumerate running processes.

tags:
  - attack.t1057

logsource:
  category: process_creation
  product: windows

detection:
  selection:
    Image|endswith:
      - 'tasklist.exe'

  filter:
    ParentImage|endswith:
      - '\powershell.exe'
      - '\cmd.exe'
      - '\explorer.exe'

  condition: selection and not filter

level: low

falsepositives:
  - Legitimate administrative activity.
  - System administrators, scripts, or monitoring tools enumerating running processes.