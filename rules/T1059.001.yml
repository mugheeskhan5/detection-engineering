title: Encoded Command Execution
id: 6091cbfc-a258-41de-bccc-4f46df05312b
status: test
description: Detects execution of PowerShell with an encoded command.

logsource:
  category: process_creation
  product: windows

detection:
  selection:
    CommandLine|contains|all:
      - 'powershell.exe'
      - ' -e'

  filter:
    ParentImage|endswith:
      - '\powershell.exe'
      - '\cmd.exe'
      - '\explorer.exe'

  condition: selection and not filter

level: medium

falsepositives:
  - Legitimate execution of encoded commands for configuration.
  - Software setup or installation processes using encoded PowerShell commands.

tags:
  - attack.T1059.001